[project]
name = "price-of-permission"
version = "0.1.0"
description = "Payoff-sweep experiment on unauthorized action in multi-user agent systems"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai>=0.3.289",
    "anthropic",
    "google-genai",
    "openai",
    "pandas",
    "matplotlib",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wt"]
